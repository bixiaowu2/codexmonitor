# /etc/systemd/system/radar-holdings.service.d/fix-paths.conf
# 修复: /var/lib/alpha-radar 数据目录迁移删除后, 原unit的ReadWritePaths指向不存在路径
# 导致 226/NAMESPACE 每分钟失败。空值重置列表后再设新路径。
# alpha域持仓(alpha_positions读/var/lib/alpha-radar/radar.sqlite)优雅降级为空。
[Service]
ReadWritePaths=
ReadWritePaths=/var/lib/radar-holdings
