services:
  radar:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - radar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  radar-data:
