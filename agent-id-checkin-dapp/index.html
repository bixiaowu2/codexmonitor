<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent ID 每日签到 · 雷达数据门禁</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Agent ID 每日签到</h1>
      <p class="sub">持有 Agent ID 地址，签到后展示完整数据面板</p>
      <p class="notice">合约已部署于 BNB Smart Chain 主网；本页仅浏览器注入钱包连接，不使用网页扫码登录。签到后展示完整数据面板，不宣称加密解锁。数据仅供研究参考，非投资建议。</p>
    </header>

    <section class="card" id="gate">
      <button id="connect" type="button">连接钱包</button>
      <button id="checkin" type="button" disabled>签到解锁</button>
      <div id="status" role="status">未连接钱包</div>
    </section>

    <section id="leaderboard" class="hidden">
      <h2>签到排行榜 <span class="muted">（只读链上事件）</span></h2>
      <p class="muted">统计投稿期内交互过本合约的地址；连续天数按链上区块时间推算。</p>
      <div id="counters" class="counters"></div>
      <div id="board"></div>
    </section>

    <section id="panel" class="hidden">
      <h2>当日雷达数据 <span id="data-date"></span></h2>
      <p id="generated-at" class="muted"></p>
      <div id="sections"></div>
    </section>
    <footer>非投资建议 · 动态数据可能滞后 · 签到状态以链上为准 · 每笔签到都是链上交易，需钱包确认并自行承担 gas</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
